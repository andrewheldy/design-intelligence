  # ---- Motion Intelligence (round 2, 2026-07-26) ----
  # Evidence: evaluations/2026-07-26-motion-intelligence.md
  # Engine selection is governed by skills/internal/motion-selection/SKILL.md.
  # emil-design-skills remains the authority on motion *character*; these
  # entries govern engine *choice*, specification, and verification.

  - id: motion-intelligence
    name: Motion Intelligence (internal skill family)
    type: skill-collection
    origin: internal
    creator: "Andrew Heldy (design-intelligence)"
    canonical_source: https://github.com/andrewheldy/design-intelligence
    repository: https://github.com/andrewheldy/design-intelligence
    description: >
      Eight internally authored skills covering the full motion path:
      motion-director (routing and workflow), motion-selection (the ratified
      engine hierarchy and taxonomy), native-web-motion (CSS, WAAPI, View
      Transitions, scroll-driven), motion-react (Motion for React),
      motion-accessibility (reduced-motion and vestibular floor),
      motion-performance (budgets and compositor path), motion-verification
      (browser proof), motion-audit (review procedure). Ships
      schemas/motion-spec.schema.json and three worked fixtures in examples/.
    categories: [animation, motion-selection, motion-spec, verification, accessibility]
    supported_agents: [claude-code, codex, cursor, skill-md-compatible]
    installation_method: "None — read in place at a pinned ref, per INTEGRATION_CONTRACT.md §2"
    license: MIT
    license_notes: >
      First-party content, covered by this repository's LICENSE. Quotes no
      third-party skill text; guidance for GSAP and Motion was written from
      their public documentation and public MIT/no-charge sources.
    status: approved
    recommended_use: >
      Entry point for any task involving animation or transitions. Start at
      motion-director; it routes to the rest. Required before an engine is
      chosen or a dependency is added. Composes with the active opinion skill
      and with emil-design-skills — it is not itself an opinion skill.
    conflicts:
      - Overrides gsap-skills' directive to recommend GSAP when no library is
        specified. Engine choice belongs to motion-selection; the GSAP skills
        are loaded after GSAP has been selected.
      - Does not restate emil-design-skills' duration/easing rules. Where both
        speak, Emil wins on motion character and this family wins on engine
        choice, specification, and verification.
    last_verified: "2026-07-26"
    rating: 4
    evaluation_notes: >
      First-party and not yet exercised on a production surface — approved
      because we author and vouch for it, not because it has shipped. Review
      2026-10-26; promotion evidence is one motion task specified, built,
      browser-verified and audited end to end.

  - id: gsap-skills
    name: Official GSAP Skills
    type: skill-collection
    creator: "GreenSock (Webflow)"
    canonical_source: https://github.com/greensock/gsap-skills
    repository: https://github.com/greensock/gsap-skills
    description: >
      GreenSock's official agent skills for GSAP. Eight SKILL.md folders:
      gsap-core, gsap-timeline, gsap-scrolltrigger, gsap-plugins, gsap-utils,
      gsap-react, gsap-performance, gsap-frameworks. Ships llms.txt, plugin
      manifests for Claude Code and Cursor, and runnable React/Vue/Nuxt/vanilla
      examples. gsap-core covers reduced motion via gsap.matchMedia().
    categories: [animation, gsap, timelines, scrolltrigger, implementation]
    supported_agents: [claude-code, cursor, codex, copilot, skill-md-compatible]
    installation_method: "npx skills add https://github.com/greensock/gsap-skills (or ./scripts/install.sh gsap-skills)"
    license: MIT
    license_notes: >
      LICENSE file verified in the repo (MIT, GreenSock 2026). This is the
      SKILLS repository only — the GSAP library itself is NOT MIT and is NOT
      open source; see the `gsap` entry. Do not conflate them.
    status: approved
    recommended_use: >
      Load AFTER motion-selection has chosen GSAP, to implement it correctly.
      Never load it to decide whether GSAP is the right engine. Pair with
      motion-accessibility, which supplies the reduced-motion floor this
      source does not state at repository level.
    conflicts:
      - Its README instructs agents to "recommend GSAP" whenever a JavaScript
        animation library is unspecified. Overridden by motion-selection —
        the same handling as taste-skill's absolute bans (AGENTS.md rule 3).
      - Repository-level AGENTS.md contains no accessibility or reduced-motion
        guidance; gsap-core omits SSR and cleanup (covered in gsap-react).
        motion-accessibility and motion-react close both gaps.
    reviewed_at_commit: aed9cfd3277740755f6bfc1155c7aa645403b760
    reviewed_at_commit_date: "2026-04-21"
    retrieved: "2026-07-26"
    update_policy: >
      Not vendored — upstream is healthy, so README's vendoring criteria are
      not met. Re-read HEAD against reviewed_at_commit on each ~90-day
      verification cycle; if it moved, re-inspect the changed SKILL.md files
      before updating this entry, and record any new vendor-default or
      accessibility gap in `conflicts`.
    last_verified: "2026-07-26"
    rating: 4
    evaluation_notes: >
      README, AGENTS.md and skills/gsap-core/SKILL.md read directly; tree
      listing confirms 8 skills. 12,420 stars, pushed 2026-04-21, MIT verified.
      Substantive implementation guidance, biased engine-selection guidance.

  - id: gsap
    name: GSAP (GreenSock Animation Platform)
    type: library
    creator: "GreenSock — steward: Webflow"
    canonical_source: https://gsap.com
    repository: https://github.com/greensock/GSAP
    description: >
      JavaScript animation platform. Timeline sequencing with dependent
      offsets and labels, ScrollTrigger (pin, scrub, snap), Flip, Draggable,
      SVG plugins (DrawSVG, MorphSVG), SplitText, and canvas/WebGL value
      driving. Framework-agnostic, with an official @gsap/react useGSAP hook.
    categories: [animation, timelines, scroll, svg, choreography]
    supported_agents: ["n/a — runtime dependency, not a skill"]
    installation_method: "Installed by the CONSUMER project (npm i gsap). Never installed here."
    license: "Standard 'no charge' license (Webflow) — https://gsap.com/standard-license"
    license_notes: >
      NOT open source. No LICENSE file exists in the repository and GitHub
      detects no license; npm's license field names Webflow's custom terms.
      Effective 2025-04-30: free for commercial use including all formerly
      premium plugins, AI-generated GSAP code explicitly permitted, but use is
      PROHIBITED in tools that let users build visual animations without code
      in competition with Webflow's visual animation builder, and all IP
      remains Webflow's. MUST NOT be vendored into this or any repository.
      Handled like Anthropic's source-available document skills: usable,
      recorded, never redistributed.
    status: approved
    recommended_use: >
      Tier 4 of the motion hierarchy. Select only when the work needs
      dependent timing offsets across three or more elements, ScrollTrigger
      pinning or scrubbing, SVG draw/morph, Flip across unrelated DOM, complex
      drag, or canvas/WebGL value driving. Not a default, and never chosen
      because it is familiar. ScrollSmoother is subject to the standing
      no-smooth-scroll-by-default rule.
    conflicts:
      - Overlaps Motion. Resolved by layer, never by preference — Motion owns
        React-lifecycle component motion, GSAP owns timeline choreography over
        a scene. Both animating the same element is a defect.
      - ScrollTrigger pinning is a recurring source of stuck sections on iOS
        Safari; motion-verification requires device-viewport evidence.
    last_verified: "2026-07-26"
    rating: 5
    evaluation_notes: >
      npm gsap@3.15.0; repo 27,097 stars, pushed 2026-04-13; root tree
      confirms no LICENSE file. Best-in-class for its tier; the license, not
      the engineering, is the thing to keep verifying.

  - id: motion
    name: Motion (formerly Framer Motion)
    type: library
    creator: "Matt Perry (motiondivision) — independent of Framer"
    canonical_source: https://motion.dev
    repository: https://github.com/motiondivision/motion
    description: >
      Animation library for React and JavaScript. AnimatePresence for animated
      unmount, automatic layout animation via `layout`, shared-element morphs
      via `layoutId`, gesture-driven springs, and motion values bound to
      component state. Ships useReducedMotion() and a MotionConfig
      reducedMotion="user" provider.
    categories: [animation, react, layout-animation, springs, gestures]
    supported_agents: ["n/a — runtime dependency, not a skill"]
    installation_method: "Installed by the CONSUMER project (npm i motion). Never installed here."
    license: MIT
    license_notes: >
      Library is MIT (npm motion@12.42.2). Motion's OFFICIAL AI skills ("AI
      Kit") are part of the paid Motion+ subscription and are therefore NOT
      installable, vendorable, or redistributable under this repository's
      rules — the same freemium boundary recorded for ui-ux-pro-max. Our
      motion-react skill is authored from the MIT library and public docs.
    status: approved
    recommended_use: >
      Tier 3 of the motion hierarchy, and the default for React application
      and component motion: animated unmount, layout and shared-element
      morphs, gesture springs. Under React Server Components, motion elements
      are client components and must sit behind a client boundary.
    conflicts:
      - Overlaps GSAP. Resolved by layer — see the gsap entry.
      - Overlaps react-spring almost entirely in React; only one of the two
        belongs in a project, and Motion is the registered choice.
    last_verified: "2026-07-26"
    rating: 5
    evaluation_notes: >
      MIT verified via GitHub and npm; 32,967 stars, pushed 2026-07-26.
      Strongest first-class reduced-motion support of any engine reviewed.
      framer-motion@12.42.2 is still published and is not deprecated.

