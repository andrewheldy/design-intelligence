# design-intelligence registry
# Every entry was verified against its live source on `last_verified`.
# Statuses: candidate | approved | experimental | rejected | license-review
# Ratings: 1-5, our judgment of usefulness for design work across ventures.
# Full evaluation rationale lives in evaluations/.
#
# Types: skill | skill-collection | workflow | directory | library.
# `library` entries are runtime dependencies a consumer project installs, not
# skills an agent loads. They are registered because their license, ownership,
# and maintenance state are governance facts that decide whether a project may
# ship them. Nothing in this repository installs them.
#
# `origin: internal` marks content authored in this repository (MIT, ours).
# Its absence means the entry describes an external source — the original 13
# entries predate the field and are all external.
#
# Optional `reviewed_at_commit` records the upstream commit actually inspected,
# so a decision can be reproduced even though nothing is vendored or pinned
# mechanically (INTEGRATION_CONTRACT.md §8).
#
# Licensing note: this file's own text (schema, descriptions, ratings, notes)
# is covered by this repository's MIT LICENSE. Listing a source here does not
# relicense it — each entry's `license` field names that source's own license,
# read from its LICENSE file, and that license governs the source unchanged.
# A source being free of charge does not make it open source: see the `gsap`
# entry. See "Licensing and attribution rules" in README.md and LICENSE (Scope).

