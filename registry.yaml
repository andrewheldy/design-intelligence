# design-intelligence registry
# Every entry was verified against its live source on `last_verified`.
# Statuses: candidate | approved | experimental | rejected | license-review
# Ratings: 1-5, our judgment of usefulness for design work across ventures.
# Full evaluation rationale lives in evaluations/.
#
# Licensing note: this file's own text (schema, descriptions, ratings, notes)
# is covered by this repository's MIT LICENSE. Listing a source here does not
# relicense it — each entry's `license` field names that source's own license,
# read from its LICENSE file, and that license governs the source unchanged.
# See "Licensing and attribution rules" in README.md and LICENSE (Scope).

version: 1
updated: "2026-07-26"

sources:
  - id: emil-design-skills
    name: Skills for Design Engineers
    type: skill-collection
    creator: Emil Kowalski
    canonical_source: https://github.com/emilkowalski/skills
    repository: https://github.com/emilkowalski/skills
    description: >
      Seven first-party skills encoding Emil Kowalski's animation and UI-polish
      philosophy: emil-design-eng, review-animations, improve-animations,
      find-animation-opportunities, animation-vocabulary, apple-design,
      pick-ui-library. Concrete rules (easing bezier values, duration caps,
      transform-origin, reduced-motion) rather than persona prose.
    categories: [animation, motion-review, design-engineering, ui-polish]
    supported_agents: [claude-code, cursor, codex, skill-md-compatible]
    installation_method: "npx skills@latest add emilkowalski/skills"
    license: MIT
    license_notes: LICENSE file verified in repo.
    status: approved
    recommended_use: >
      Default motion authority. Install review-animations and emil-design-eng
      in any project with meaningful UI motion; use animation-vocabulary when
      prompting any agent for animation work.
    conflicts:
      - Overlaps design-motion-principles (which distills this author's public
        work); prefer this canonical source.
      - Strict duration/easing rules may conflict with brand motion languages.
    last_verified: "2026-07-26"
    rating: 5
    evaluation_notes: SKILL.md inspected in full; dense and substantive. See evaluations/2026-07-26-initial-research.md.

  - id: anthropic-skills
    name: Anthropic Agent Skills (design subset)
    type: skill-collection
    creator: Anthropic
    canonical_source: https://github.com/anthropics/skills
    repository: https://github.com/anthropics/skills
    description: >
      Official Anthropic skills repo. Design-relevant subset: frontend-design
      (anti-generic design methodology), brand-guidelines, theme-factory,
      canvas-design, algorithmic-art, web-artifacts-builder, webapp-testing.
      Also the reference implementation of the SKILL.md format (spec/, template/).
    categories: [frontend-design, brand, theming, skill-format-reference]
    supported_agents: [claude-code, claude-api, skill-md-compatible]
    installation_method: "Claude plugin marketplace, or copy individual skill folders"
    license: Apache-2.0
    license_notes: >
      Apache-2.0 for most skills. Document skills (docx/pdf/pptx/xlsx) are
      source-available, NOT open source — do not vendor those. Design skills
      are Apache-2.0; attribution required on redistribution.
    status: approved
    recommended_use: >
      frontend-design as the default product-UI design skill (softer and
      broader-scoped than taste-skill). spec/ + template/ as the authoring
      standard for our internal skills.
    conflicts:
      - Philosophy overlaps taste-skill; do not run both on the same task.
    last_verified: "2026-07-26"
    rating: 5
    evaluation_notes: frontend-design SKILL.md inspected in full.

  - id: taste-skill
    name: Taste Skill
    type: skill-collection
    creator: Leonxlnx
    canonical_source: https://www.tasteskill.dev/
    repository: https://github.com/Leonxlnx/taste-skill
    description: >
      "Anti-slop" frontend framework. 13 skills; flagship design-taste-frontend
      (v2) infers a design read from the brief, sets three dials
      (DESIGN_VARIANCE, MOTION_INTENSITY, VISUAL_DENSITY), and enforces 100+
      rules with hard bans on AI tells (em-dashes, three equal feature cards,
      default Inter, centered hero + purple gradient, div-based fake
      screenshots) plus a mechanical pre-flight check.
    categories: [frontend-design, anti-slop, landing-pages, visual-taste]
    supported_agents: [claude-code, codex, cursor, chatgpt-images]
    installation_method: 'npx skills add https://github.com/Leonxlnx/taste-skill --skill "design-taste-frontend"'
    license: MIT
    license_notes: LICENSE file verified.
    status: approved
    recommended_use: >
      Landing pages, portfolios, marketing surfaces ONLY (its own stated
      scope). Treat as a preference framework with override gates; overrides
      must be stated in the brief. Do not use on dashboards or product UI.
    conflicts:
      - High conflict with anthropic frontend-design and ui-ux-pro-max —
        competing sources of typography/palette/layout truth. One at a time.
      - Absolute bans (fonts, em-dash, centered layouts) can violate brand
        guidelines; mandatory motion above dial 4 can violate reduced-motion
        policies. Anti-Slop Reviewer agent must not inherit its bans as law.
    last_verified: "2026-07-26"
    rating: 4
    evaluation_notes: >
      v2 SKILL.md inspected in full; substantive but aggressive, and v2 is
      self-labeled experimental by the author.

  - id: oneredoak-design-review
    name: OneRedOak Design Review Workflow
    type: workflow
    creator: OneRedOak (Patrick Ellis)
    canonical_source: https://github.com/OneRedOak/claude-code-workflows
    repository: https://github.com/OneRedOak/claude-code-workflows
    description: >
      Design-review workflow: a Claude Code subagent drives a live browser via
      Playwright MCP, reviews UI against Stripe/Airbnb/Linear-tier standards,
      WCAG AA+, responsive behavior and interaction patterns; runs on PRs or
      on demand via slash command.
    categories: [design-review, ui-review, workflow, live-testing]
    supported_agents: [claude-code]
    installation_method: "No installer; copy design-review/ agent + command files into project"
    license: MIT
    license_notes: LICENSE file verified.
    status: approved
    recommended_use: >
      Source pattern for our reviewer agents (live-browser review loop).
      Adapted internally in agents/ rather than installed verbatim.
    conflicts: []
    last_verified: "2026-07-26"
    rating: 4
    evaluation_notes: Repo tree inspected; workflow structure confirmed (code-review/, design-review/, security-review/).

