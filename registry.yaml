  - id: ui-ux-pro-max
    name: UI/UX Pro Max
    type: skill
    creator: nextlevelbuilder (org; team identity not independently verified)
    canonical_source: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
    repository: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
    description: >
      Retrieval-based design intelligence: CSV databases (192 product types,
      84 UI styles, 192 palettes, 74 font pairings, 161 reasoning rules,
      98 UX guidelines, 22 stacks) queried by Python scripts to assemble a
      design system per product type.
    categories: [design-system-generation, ui-styles, palettes, typography]
    supported_agents: [claude-code, cursor, codex-cli, gemini-cli, windsurf, copilot, 13-others]
    installation_method: "npm i -g ui-ux-pro-max-cli && uipro init --ai claude (or Claude plugin marketplace)"
    license: MIT
    license_notes: >
      MIT covers the open-source Basic tier only; a paid Premium tier exists
      (freemium). Verify tier boundaries before any vendoring.
    status: experimental
    recommended_use: >
      Trial in an isolated project when a venture needs fast, conventional
      design-system scaffolding. Not the default: database-driven selection
      trends templated — the opposite of the taste direction.
    conflicts:
      - High conflict with taste-skill and anthropic frontend-design; never
        active simultaneously.
    last_verified: "2026-07-26"
    rating: 3
    evaluation_notes: >
      Databases confirmed real by tree inspection; marketing overclaims
      ("complete design system in seconds"); very large footprint.

  - id: design-motion-principles
    name: design-motion-principles
    type: skill
    creator: kylezantos
    canonical_source: https://github.com/kylezantos/design-motion-principles
    repository: https://github.com/kylezantos/design-motion-principles
    description: >
      Two-mode motion skill (create/audit) weighting guidance across three
      lenses distilled from the published work of Emil Kowalski, Jakub Krehel,
      and Jhey Tompkins; ships audit checklists, anti-checklist, motion
      cookbook, and HTML audit-report templates with looping CSS demos.
    categories: [animation, motion-review, audit]
    supported_agents: [skill-md-compatible]
    installation_method: "npx skills add kylezantos/design-motion-principles"
    license: MIT
    license_notes: >
      MIT by the distiller, but content derives from named third parties'
      published teaching (credited). Do not vendor; link or install only.
    status: experimental
    recommended_use: >
      Secondary to emil-design-skills. Worth studying for its audit-report
      format and multi-lens weighting; use its audit mode when a visual
      HTML motion report is wanted.
    conflicts:
      - Direct overlap with emil-design-skills review/improve-animations;
        prefer the canonical source.
    last_verified: "2026-07-26"
    rating: 3
    evaluation_notes: Full tree inspected (workflows/, references/); well-built.

