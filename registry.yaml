    license_notes: >
      v4 (animejs@4.5.0) is MIT. v3 was dual-licensed — relevant only to
      projects still on v3.
    status: candidate
    recommended_use: >
      Link only. Genuinely good and genuinely popular, but it occupies the
      same ground as GSAP (timelines, stagger) and Motion (component motion)
      without offering a capability either lacks. Registering a third
      overlapping engine raises the odds of two engines animating one element.
      Popularity is not a reason to adopt. Revisit if a project needs GSAP-like
      timelines under a strictly open-source license.
    conflicts:
      - Near-total overlap with gsap and motion.
    last_verified: "2026-07-26"
    rating: 3
    evaluation_notes: >
      MIT verified via npm and GitHub; 71,514 stars, pushed 2026-06-22.
      Not rejected — a legitimate MIT alternative if GSAP's proprietary terms
      ever become unacceptable.

