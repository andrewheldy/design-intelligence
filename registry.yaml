  - id: lenis
    name: Lenis
    type: library
    creator: darkroom.engineering
    canonical_source: https://lenis.darkroom.engineering
    repository: https://github.com/darkroomengineering/lenis
    description: Smooth-scroll library that replaces native scrolling with an interpolated scroll position.
    categories: [scroll, smooth-scroll]
    supported_agents: ["n/a — runtime dependency, not a skill"]
    installation_method: "Not adopted by default. Link only."
    license: MIT
    license_notes: LICENSE verified; lenis@1.3.25.
    status: candidate
    recommended_use: >
      NEVER BY DEFAULT. The library is well built; the technique is the
      problem. Replacing native scrolling degrades find-in-page, keyboard
      paging (Space / PageDown / Home / End), scroll anchoring, and AT scroll
      behavior, and it is a recognized vestibular trigger. Permitted only with
      written justification in the DESIGN_BRIEF, full suppression under
      prefers-reduced-motion, and browser evidence for keyboard paging and
      find-in-page. The same rule governs GSAP's ScrollSmoother.
    conflicts:
      - Tension with AGENTS.md rule 5 (accessibility floor) whenever it is
        enabled without the verification evidence above.
    last_verified: "2026-07-26"
    rating: 2
    evaluation_notes: >
      14,958 stars, pushed 2026-07-23, MIT verified. Registered mainly so the
      never-by-default rule has somewhere to live and is not re-litigated.

