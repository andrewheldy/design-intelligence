    categories: [animation, state-machines, designer-authored, wasm]
    supported_agents: ["n/a — runtime dependency, not a skill"]
    installation_method: "Installed by the CONSUMER project (npm i @rive-app/canvas). Never installed here."
    license: MIT
    license_notes: >
      The RUNTIME is MIT (@rive-app/canvas@2.39.1). The EDITOR is proprietary
